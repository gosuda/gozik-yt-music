name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  GOCACHEPROG: ""
  GOENV: "off"

jobs:
  build-linux-amd64:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
      - name: Download Node.js
        run: |
          mkdir -p .tools
          curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz | tar -xJ --strip-components=1 -C .tools
      - name: Prepare certifi
        run: |
          mkdir -p certifi
          cp "$(.venv/bin/python -c 'import certifi; print(certifi.where())')" certifi/cacert.pem
      - name: Build with PyInstaller
        run: |
          .venv/bin/pyinstaller server.py \
            --name=gozik-yt-music-server \
            --onedir \
            --distpath=dist \
            --workpath=build \
            --hidden-import=ytmusicapi \
            --hidden-import=grpc \
            --hidden-import=grpc._cython \
            --hidden-import=grpc._cython.cygrpc \
            --hidden-import=google.protobuf \
            --hidden-import=google.protobuf.internal \
            --hidden-import=yt_dlp \
            --hidden-import=yt_dlp.extractor \
            --hidden-import=yt_dlp.extractor.youtube \
            --hidden-import=requests \
            --hidden-import=certifi \
            --hidden-import=charset_normalizer \
            --hidden-import=idna \
            --hidden-import=urllib3 \
            --hidden-import=generated \
            --hidden-import=handlers \
            --collect-all=ytmusicapi \
            --collect-all=grpc \
            --collect-all=google.protobuf \
            --collect-all=yt_dlp \
            --collect-all=certifi \
            --add-data=generated:generated \
            --add-data=certifi/cacert.pem:certifi \
            --add-binary=.tools/bin/node:. \
            --exclude-module=tkinter \
            --exclude-module=unittest \
            --exclude-module=test \
            --exclude-module=grpc_tools \
            --exclude-module=lib2to3 \
            --exclude-module=pydoc \
            --exclude-module=doctest \
            --noconfirm \
            --clean
      - name: Package
        run: |
          cd dist
          tar czf gozik-yt-music-server-linux-amd64.tar.gz gozik-yt-music-server
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gozik-yt-music-server-linux-amd64
          path: dist/gozik-yt-music-server-linux-amd64.tar.gz

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version: '1.21'
          cache-dependency-path: installer/go/go.sum
      - name: Verify release Go cache isolation
        shell: bash
        run: |
          set -euo pipefail
          cache_program=$(go env GOCACHEPROG)
          test -z "$cache_program"

      - name: Install Fyne build dependencies
        working-directory: installer/go
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev
      - name: Test installer
        working-directory: installer/go
        run: go test ./...
      - name: Build installer
        working-directory: installer/go
        run: go build -ldflags="-s -w" -o gozik-yt-music-installer-linux-amd64 .
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gozik-yt-music-installer-linux-amd64
          path: installer/go/gozik-yt-music-installer-linux-amd64

